<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img" aria-label="Diploma of the 1903 prize">
  <rect width="460" height="320" fill="#faf7ef"/>
  <rect x="14" y="14" width="432" height="292" fill="none" stroke="#b08d3f" stroke-width="3"/>
  <rect x="26" y="26" width="408" height="268" fill="none" stroke="#b08d3f" stroke-width="1"/>
  <text x="230" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#3a3730">The Nobel Prize in Physics</text>
  <text x="230" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#b08d3f">1903</text>
  <text x="230" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3a3730">Henri Becquerel · Pierre Curie · Marie Curie</text>
  <text x="230" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6b6862">for their researches on radiation phenomena</text>
