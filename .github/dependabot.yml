version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
          - "obsidian"
    ignore:
      # obsidian pins @codemirror/* peers to exact versions, so independent
      # bumps break `npm ci` with ERESOLVE. They come in with obsidian itself.
      # That pin is also below what @codemirror/commands asks for, which is why
      # package.json overrides @codemirror/state to the one obsidian provides:
      # a second nested copy is one the editor cannot read its own state from.
      - dependency-name: "@codemirror/*"
