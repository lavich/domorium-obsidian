<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GEDCOM editor harness</title>
    <link rel="stylesheet" href="palette.css" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="theme-light">
    <div id="controls">
      <select id="sample"></select>
      <label><input type="checkbox" id="dark" /> dark</label>
      <label
        ><input type="checkbox" id="diagnostics" checked /> diagnostics</label
      >
      <label><input type="checkbox" id="hints" checked /> indent hints</label>
      <label
        ><input type="checkbox" id="realistic" checked /> real palette</label
      >
      <button type="button" id="problems">problems panel</button>
      <button type="button" id="search">search panel</button>
    </div>
    <div class="workspace-leaf-content" data-type="domorium-gedcom">
      <div class="view-content gedcom-gedcom-view">
        <div id="editor" class="gedcom-gedcom-editor"></div>
      </div>
    </div>
    <div class="mobile-navbar"></div>
    <script src="dist/mount.js"></script>
  </body>
</html>
