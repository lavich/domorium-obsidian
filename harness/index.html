<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GEDCOM editor harness</title>
    <link rel="stylesheet" href="palette.css" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="theme-light">
    <div id="controls">
      <select id="sample"></select>
      <label><input type="checkbox" id="dark" /> dark</label>
      <label><input type="checkbox" id="diagnostics" checked /> diagnostics</label>
      <label><input type="checkbox" id="hints" checked /> indent hints</label>
      <label><input type="checkbox" id="realistic" checked /> real palette</label>
    </div>
    <div id="editor" class="gedcom-gedcom-editor"></div>
    <script src="dist/mount.js"></script>
  </body>
</html>
