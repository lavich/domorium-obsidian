<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Research desk harness</title>
    <link rel="stylesheet" href="palette.css" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        background: var(--background-primary);
        color: var(--text-normal);
        font-family: var(--font-interface);
        font-size: 14px;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      #desk-layout {
        display: flex;
        height: 100vh;
      }
      #desk-layout.is-phone #tab-placeholder {
        display: none;
      }
      #tab-placeholder {
        flex: 1;
        min-width: 0;
      }
      #card-pane {
        flex: none;
        min-height: 0;
        background: var(--background-secondary);
      }
    </style>
  </head>
  <body class="theme-light">
    <div id="desk-layout">
      <div id="tab-placeholder"></div>
      <div id="card-pane" class="workspace-leaf-content" data-type="domorium-record">
        <div id="card" class="view-content gedcom-record-view"></div>
      </div>
    </div>
    <script src="dist/desk.js"></script>
  </body>
</html>
